[build]
  command = "npm install --prefix frontend && npm run build --prefix frontend"
  publish = "frontend/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = [
    "express",
    "serverless-http",
    "pg",
    "bcrypt",
    "jsonwebtoken",
    "dotenv",
    "sasl"
  ]

# API requests go to the Express serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# React Router routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200